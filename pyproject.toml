[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caveat-shell"
version = "1.0.1"
description = "Read before you run — an offline reader that explains a shell command, and the risks in it, without ever running it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "at0m-b0mb" }]
keywords = ["shell", "bash", "security", "education", "command-line", "static-analysis", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Security",
    "Topic :: System :: Shells",
]
dependencies = ["PyQt6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/at0m-b0mb/Caveat"
Source = "https://github.com/at0m-b0mb/Caveat"

[project.scripts]
caveat = "caveat.cli:main"

[project.gui-scripts]
caveat-gui = "caveat.app:main"

[tool.setuptools]
packages = ["caveat", "caveat.core", "caveat.ui"]
